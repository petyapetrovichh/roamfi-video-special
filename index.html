<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="History">
<meta name="theme-color" content="#F2F4F8">
<meta name="format-detection" content="telephone=no, date=no">
<title>History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F4F8;
    --text: #111111;
    --date: #A3A3A3;
    --line: #E1E4E9;
    --chev: #B8B8B8;
    --red: #F03E55;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --header-h: 44px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body {
    font-family: "Noto Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior-y: auto;
  }

  /* Header */
  .header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding-top: var(--safe-top);
    background: var(--bg);
  }
  .header-inner {
    position: relative; height: var(--header-h);
    display: flex; align-items: center; justify-content: center;
  }
  .title {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    font-size: 19px; font-weight: 700; letter-spacing: 0.1px; color: var(--text);
  }
  .back {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    width: 43px; height: 43px; border-radius: 50%; border: none;
    background: #F6F8FB;
    box-shadow: 0 4px 22px rgba(30, 40, 60, 0.10), 0 1px 3px rgba(30, 40, 60, 0.04);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .back:active { background: #EDF0F4; }
  .back svg { width: 20px; height: 20px; display: block; }

  /* List */
  .list {
    padding-top: calc(var(--safe-top) + var(--header-h) + 10px);
    padding-bottom: calc(var(--safe-bottom) + 24px);
  }
  .row {
    position: relative;
    margin: 0 20px;
    padding: 18px 0 17.5px;
    border-bottom: 0.5px solid var(--line);
  }
  .row:active { opacity: .6; }
  .top { display: flex; align-items: center; justify-content: space-between; height: 22px; }
  .name { font-size: 16px; font-weight: 400; line-height: 22px; }
  .right { display: flex; align-items: center; margin-right: -3px; }
  .amt { font-size: 16px; line-height: 22px; white-space: nowrap; }
  .amt b { font-weight: 700; }
  .amt.neg b { color: var(--red); }
  .chev { width: 7px; height: 12px; margin-left: 9px; display: block; }
  .date {
    margin-top: 1px; font-size: 14px; line-height: 20px;
    color: var(--date); letter-spacing: 0.1px;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <button class="back" aria-label="Back" onclick="history.length > 1 && history.back()">
      <svg viewBox="0 0 20 20" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 10H2.5"/><path d="M8.5 3.5L2 10l6.5 6.5"/>
      </svg>
    </button>
    <div class="title">History</div>
  </div>
</header>

<main class="list" id="list"></main>

<script>
  /* ===== DATA — edit here =====
     name:   row title
     amount: text after the sign, e.g. "<0.01", "0.02", "20"
     sign:   "+" or "-"   ("-" is shown in red)
     date:   "YYYY.MM.DD HH:MM"                                   */
  const DATA = [
    { name: "Revenue Share", sign: "+", amount: "<0.01", date: "2026.09.24 13:24" },
    { name: "Revenue Share", sign: "+", amount: "<0.01", date: "2026.09.24 02:24" },
    { name: "Revenue Share", sign: "+", amount: "<0.01", date: "2026.09.24 00:24" },
    { name: "Revenue Share", sign: "+", amount: "<0.01", date: "2026.09.23 23:24" },
    { name: "Revenue Share", sign: "+", amount: "<0.01", date: "2026.09.23 22:24" },
    { name: "Revenue Share", sign: "+", amount: "<0.01", date: "2026.09.23 20:24" },
    { name: "Revenue Share", sign: "+", amount: "<0.01", date: "2026.09.23 01:23" },
    { name: "Revenue Share", sign: "+", amount: "<0.01", date: "2026.09.23 00:23" },
    { name: "Revenue Share", sign: "+", amount: "<0.01", date: "2026.09.22 03:23" },

    { name: "Recharge",      sign: "+", amount: "20",    date: "2026.09.18 21:15" },
    { name: "Revenue Share", sign: "+", amount: "<0.01", date: "2026.09.18 13:36" },
    { name: "Revenue Share", sign: "+", amount: "<0.01", date: "2026.09.18 12:36" },
    { name: "Revenue Share", sign: "+", amount: "<0.01", date: "2026.09.18 11:36" },
    { name: "Revenue Share", sign: "+", amount: "<0.01", date: "2026.09.18 10:36" },
    { name: "Revenue Share", sign: "+", amount: "<0.01", date: "2026.09.18 09:36" },
    { name: "Revenue Share", sign: "+", amount: "<0.01", date: "2026.09.18 08:36" },
    { name: "Revenue Share", sign: "+", amount: "<0.01", date: "2026.09.18 07:36" },
    { name: "Revenue Share", sign: "+", amount: "0.9",   date: "2026.09.18 04:45" },

    { name: "Revenue Share", sign: "+", amount: "0.02",  date: "2026.09.16 12:34" },
    { name: "Revenue Share", sign: "+", amount: "0.04",  date: "2026.09.16 11:34" },
    { name: "Revenue Share", sign: "+", amount: "0.02",  date: "2026.09.14 08:21" },
    { name: "Flex Data",     sign: "-", amount: "0.33",  date: "2026.09.14 08:21" },
    { name: "Revenue Share", sign: "+", amount: "0.08",  date: "2026.09.14 07:21" },
    { name: "Flex Data",     sign: "-", amount: "1.12",  date: "2026.09.14 07:21" },
    { name: "Revenue Share", sign: "+", amount: "<0.01", date: "2026.09.14 05:21" },
    { name: "Flex Data",     sign: "-", amount: "0.04",  date: "2026.09.14 05:21" },
    { name: "Revenue Share", sign: "+", amount: "0.02",  date: "2026.09.13 23:21" },
  ];

  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const chev = '<svg class="chev" viewBox="0 0 7 12" fill="none" stroke="#B8B8B8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l5 5-5 5"/></svg>';

  document.getElementById("list").innerHTML = DATA.map(r => `
    <div class="row">
      <div class="top">
        <span class="name">${esc(r.name)}</span>
        <span class="right">
          <span class="amt${r.sign === "-" ? " neg" : ""}"><b>${esc(r.sign + r.amount)}</b> USD</span>${chev}
        </span>
      </div>
      <div class="date">${esc(r.date)}</div>
    </div>`).join("");
</script>
</body>
</html>
